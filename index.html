<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- TODO: Set the document title to the name of your application -->
    <title>KAPL 3.0 — Live Player Auction</title>
    <meta name="description" content="Real-time Player Auction for KAPL 3.0" />
    <meta name="author" content="KAPL Organizing Committee" />

    <meta name="theme-color" content="#0A0E17" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#EAB308" media="(prefers-color-scheme: light)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KAPL 3.0 Auction" />

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <link rel="manifest" href="/manifest.json" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="KAPL 3.0 — Live Player Auction" />
    <meta property="og:description" content="Real-time Player Auction for KAPL 3.0" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="KAPL 3.0 — Live Player Auction" />
    <meta name="twitter:description" content="Real-time Player Auction for KAPL 3.0" />
    <link rel="icon" type="image/x-icon" href="https://storage.googleapis.com/gpt-engineer-file-uploads/56Redu9ZEEdfE0cooYAohivdMyn1/uploads/1766148100242-kapl.jpeg" />

    <script>
      // Clean up any stale service workers or caches that could lock old chunk hashes
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var i = 0; i < regs.length; i++) {
            regs[i].unregister();
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(keys) {
          for (var i = 0; i < keys.length; i++) {
            caches.delete(keys[i]);
          }
        });
      }
    </script>
  </head>

  <body>
    <div id="root">
      <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0A0E17;color:#F8FAFC;font-family:system-ui,-apple-system,sans-serif;text-align:center;padding:24px;">
        <div style="width:52px;height:52px;border-radius:16px;background:rgba(234,179,8,0.15);display:flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:16px;box-shadow:0 0 25px -4px rgba(234,179,8,0.35);">
          🏏
        </div>
        <div style="font-weight:800;font-size:18px;letter-spacing:0.04em;color:#EAB308;">KAPL 3.0 AUCTION</div>
        <div style="font-size:13px;color:rgba(255,255,255,0.6);margin-top:8px;">Loading live auction stadium...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener('error', function(e) {
        if (e && e.message && (e.message.indexOf('Failed to fetch dynamically imported module') !== -1 || e.message.indexOf('Failed to load module script') !== -1)) {
          var root = document.getElementById('root');
          if (root) {
            root.innerHTML = '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0A0E17;color:#F8FAFC;font-family:system-ui,-apple-system,sans-serif;text-align:center;padding:24px;">' +
              '<div style="font-size:32px;margin-bottom:12px;">⚡</div>' +
              '<div style="font-weight:700;font-size:18px;color:#EAB308;margin-bottom:8px;">New Version Available</div>' +
              '<div style="font-size:13px;color:rgba(255,255,255,0.7);max-width:320px;margin-bottom:20px;">A fresh update was deployed. Please click reload to load the latest auction stage.</div>' +
              '<button onclick="window.location.reload(true)" style="background:#EAB308;color:#0A0E17;border:none;padding:10px 24px;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;">Reload Auction</button>' +
              '</div>';
          }
        }
      });
    </script>
  </body>
</html>
